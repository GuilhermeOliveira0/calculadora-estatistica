# Publica a calculadora no GitHub Pages sempre que houver push na branch main.
# Também pode ser rodado na mão pela aba "Actions" do GitHub (botão "Run workflow").
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas: ler o código e publicar no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Se dois pushes chegarem juntos, só a publicação mais nova continua
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Conferir se o index.html existe
        run: test -f index.html

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empacotar os arquivos do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v5
